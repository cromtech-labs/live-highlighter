name: $(Date:yyyyMMdd).$(Rev:r)

pr:
  branches:
    include:
      - main
trigger:
  branches:
    include:
      - main

jobs:
- job: build_and_deploy_job
  displayName: Build and Deploy Job
  condition: or(eq(variables['Build.Reason'], 'Manual'),or(eq(variables['Build.Reason'], 'PullRequest'),eq(variables['Build.Reason'], 'IndividualCI')))
  pool:
    vmImage: ubuntu-latest
  variables:
  - group: Azure-Static-Web-Apps-green-wave-027c32500-variable-group
  steps:
  - checkout: self
    submodules: true

  - task: UsePythonVersion@0
    displayName: 'Use Python 3.11'
    inputs:
      versionSpec: '3.11'
      addToPath: true

  - script: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
    displayName: 'Install MkDocs dependencies'

  - script: |
      mkdocs build --config-file mkdocs.yml --site-dir site
    displayName: 'Build MkDocs site'
    workingDirectory: $(Build.SourcesDirectory)

  - task: AzureStaticWebApp@0
    displayName: 'Deploy to Azure Static Web Apps'
    inputs:
      azure_static_web_apps_api_token: $(AZURE_STATIC_WEB_APPS_API_TOKEN_GREEN_WAVE_027C32500)
      app_location: "/"
      api_location: ""
      output_location: "site"
      skip_app_build: true
